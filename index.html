<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - JieLo Ice Cream</title>

  <!-- Import Font Poppins & Georgia -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    /* Layout 2 Kolom Seimbang */
    .split-container {
      width: 100vw;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    /* ================= SISI KIRI (Kuning Krem Pastel) ================= */
    .left-side {
      background-color: #fdf8e2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
    }

    .main-logo {
      width: 200px;
      height: 200px;
      object-fit: contain;
      margin-bottom: 2px;
    }

    .brand-name {
      font-size: 32px;
      font-weight: 800;
      color: #ff527b;
      margin-bottom: 15px;
    }

    .icecream-img {
      width: 130%;
      max-width: 400px;
      height: auto;
      object-fit: contain;
      margin-bottom: 25px;
    }

    .feature-list {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      font-size: 11.5px;
      font-weight: 700;
      color: #4a5568;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .feature-item i {
      color: #ff527b;
    }

    /* ================= SISI KANAN (Pink Pastel + Gambar Utuh) ================= */
    .right-side {
      background-color: #ffd7f6;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 30px;
    }

    /* Gambar Lelehan Utuh */
    .bg-full-element {
      position: absolute;
      top: 0;
      right: 0;
      height: 100%;
      width: auto;
      max-width: none;
      object-fit: contain;
      object-position: right top;
      pointer-events: none;
      z-index: 1;
    }

    /* Kartu Form Putih Tepat di Tengah */
    .login-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 35px 28px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 320px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .welcome-title {
      font-size: 22px;
      font-weight: 800;
      color: #ff527b;
      margin-bottom: 3px;
    }

    .welcome-desc {
      font-size: 11px;
      color: #718096;
      margin-bottom: 22px;
      line-height: 1.3;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: center;
    }

    .form-group label {
      display: block;
      font-family: 'Georgia', serif;
      font-size: 18px;
      font-weight: 700;
      color: #4a7bb0;
      margin-bottom: 6px;
    }

    .input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-box i {
      position: absolute;
      left: 14px;
      color: #ff85a2;
      font-size: 14px;
    }

    .input-box input {
      width: 100%;
      padding: 9px 12px 9px 38px;
      background-color: #ffffff;
      border: 1.5px solid #4a5568;
      border-radius: 12px;
      font-size: 12px;
      outline: none;
      color: #2d3748;
    }

    .input-box input::placeholder {
      color: #ff85a2;
    }

    .input-box input:focus {
      border-color: #ff527b;
    }

    .form-extra {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      font-size: 11px;
      color: #ff85a2;
      margin-bottom: 20px;
      margin-top: 8px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .btn-masuk {
      background: #ff527b;
      color: #ffffff;
      border: none;
      padding: 9px 36px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 82, 123, 0.3);
      transition: all 0.2s;
    }

    .btn-masuk:hover {
      background: #e91e63;
      transform: translateY(-1px);
    }

    @media (max-width: 850px) {
      .split-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="split-container">
    <!-- SISI KIRI: Kuning Krem + Logo + eskrim.png -->
    <div class="left-side">
      <img src="logoremove.png" alt="JieLo Logo" class="main-logo">
      <h1 class="brand-name">JieLo Ice Cream</h1>

      <img src="eskrim.png" alt="Produk Es Krim JieLo" class="icecream-img">

      <div class="feature-list">
        <span class="feature-item"><i class="fa-solid fa-box"></i> Manajemen Stok Otomatis</span>
        <span class="feature-item"><i class="fa-solid fa-chart-line"></i> Laporan Penjualan Real-time</span>
        <span class="feature-item"><i class="fa-solid fa-calculator"></i> Hitung Zakat Mal Praktis</span>
      </div>
    </div>

    <!-- SISI KANAN: Pink Pastel + Dekorasi Penuh Utuh + Form -->
    <div class="right-side">
      <img src="gambarfullremove.png" alt="Dekorasi Es Krim" class="bg-full-element">

      <!-- Form Card -->
      <div class="login-card">
        <h2 class="welcome-title">Selamat Datang</h2>
        <p class="welcome-desc">Masuk untuk mulai mengelola toko Anda.</p>

        <form action="dashboard.html" method="GET">
  <div class="form-group">
    <label>Username/Email</label>
    <div class="input-box">
      <i class="fa-regular fa-user"></i>
      <input type="text" placeholder="masukkan nama" required>
    </div>
  </div>

  <div class="form-group">
    <label>Password</label>
    <div class="input-box">
      <i class="fa-solid fa-lock"></i>
      <input type="password" id="passwordInput" placeholder="masukkan password" required>
    </div>
  </div>

  <div class="form-extra">
    <label class="remember-me">
      <input type="checkbox" id="togglePassword"> Tampilkan Password
    </label>
  </div>

  <button type="submit" class="btn-masuk">Masuk</button>
</form>

          <div class="form-extra">
            <label class="remember-me">
              <input type="checkbox" id="togglePassword"> Tampilkan Password
            </label>
          </div>

          <button type="submit" class="btn-masuk">Masuk</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Fitur Toggle Tampilkan Password
    const passwordInput = document.getElementById('passwordInput');
    const togglePassword = document.getElementById('togglePassword');

    togglePassword.addEventListener('change', function() {
      if (this.checked) {
        passwordInput.type = 'text';
      } else {
        passwordInput.type = 'password';
      }
    });
  </script>

</body>
</html>
